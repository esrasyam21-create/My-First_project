<!DOCTYPE html>
<html lang="en">

</head>
<body>
<main> 
        <nav>
            <h1 class="name">Activity</h1>
            <input class="search" id="input" placeholder="Enter your name">
            <button class="Login" onclick="changeInnerTxt(this)">Login</button>
        </nav>
        <div class="parent-container">
            <div class="container">
                <div class="left-side">
                    <div class="ninja-box">
                        <div class="ninja-info">
                            <h2>Welcome</h2>
                            <em>noun</em>
                            <p>Plural: <em>Engineers</em></p>
                            <button class="likes" onclick="showAlert()">13 likes</button>
                        </div>
                    <div class="ninja-bio">
                        <p>A practitioner skilled in the 
                            <a href="">Japanese</a> art of <a href="">ninjutsu</a>
                        </p>
                    </div>      
            </div>
            <div class="ninja-box">
                        <div class="ninja-info">
                            <h2>Engineer</h2>
                            <em>noun</em>
                            <p>Plural: <em>Engineers</em></p>

                            <p>A programmer who breaks down problems with 
                                <a href="#">Zen</a>-like focus

                        </div>
                    </div>

                </div>

                <div class="right-side">

                        <h3>JavaScript is defined by <span>YOU</span></h3>
                        <button class="definition" onclick="remove(this)">Add Definition</button>
                    </div>
                </div>
            </div>

            <div class="post-box">
                <div class="post-header">
                    <h3>Some User</h3>
                    <p><span id="likes">3</span> like(s)</p>
                    <button onclick="addLike()">Like</button>
